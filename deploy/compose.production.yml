name: koko-nexus

x-java-service: &java-service
  restart: unless-stopped
  networks: [platform]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp
    - /home/koko:mode=1777
  environment: &common-env
    TZ: Asia/Shanghai
    KOKO_PUBLIC_API_BASE: /koko-api
    NACOS_SERVER_ADDR: nacos:8848
    NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
    NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
    NACOS_GROUP: KOKO_NEXUS_PROD
    # HTTP 服务发现独立于 Dubbo；切换时必须同步所有 HTTP 提供方与 Gateway。
    NACOS_HTTP_GROUP: KOKO_NEXUS_PROD_HTTP
    DATABASE_USER: koko_nexus
    DATABASE_PASSWORD: ${KOKO_DB_PASSWORD:?KOKO_DB_PASSWORD is required}
    JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
  deploy:
    resources:
      limits:
        memory: 320M

services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: koko-nexus-livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    networks: [platform]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    deploy:
      resources:
        limits:
          memory: 384M

  identity:
    <<: *java-service
    container_name: koko-nexus-identity
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR_FILE: artifacts/identity-service.jar }
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://mysql:3306/koko_identity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      OUTBOX_ENABLED: "true"
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      ASSET_PUBLIC_BASE: /koko-api/assets/images
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8081/actuator/health]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  community:
    <<: *java-service
    container_name: koko-nexus-community
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR_FILE: artifacts/community-service.jar }
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://mysql:3306/koko_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      OUTBOX_ENABLED: "true"
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      ASSET_PUBLIC_BASE: /koko-api/assets/images
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8082/actuator/health]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  live:
    <<: *java-service
    container_name: koko-nexus-live
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR_FILE: artifacts/live-service.jar }
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://mysql:3306/koko_live?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      OUTBOX_ENABLED: "true"
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
    depends_on:
      identity: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8083/actuator/health]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  voice:
    <<: *java-service
    container_name: koko-nexus-voice
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR_FILE: artifacts/voice-service.jar }
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://mysql:3306/koko_voice?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      LIVEKIT_API_URL: http://koko-nexus-livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      # 候选SQL核心，不是媒体开关；正式P1验收前必须保持false。
      VOICE_INTERACTION_CORE_ENABLED: ${VOICE_INTERACTION_CORE_ENABLED:-false}
      VOICE_SIGNAL_ADMISSION_ENABLED: ${VOICE_SIGNAL_ADMISSION_ENABLED:-false}
      # 同事务计划/退场执行仍为候选，发布验收前不访问新媒体表或自动调用SFU。
      VOICE_MEDIA_PLAN_ENABLED: ${VOICE_MEDIA_PLAN_ENABLED:-false}
      VOICE_MEDIA_RETIREMENT_ENABLED: ${VOICE_MEDIA_RETIREMENT_ENABLED:-false}
      VOICE_BINDING_ADMISSION_ENABLED: ${VOICE_BINDING_ADMISSION_ENABLED:-false}
      KOKO_GATEWAY_INTERNAL_KEY: ${KOKO_GATEWAY_INTERNAL_KEY:?KOKO_GATEWAY_INTERNAL_KEY is required}
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx144m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    depends_on:
      identity: { condition: service_healthy }
      livekit: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8084/actuator/health]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  notification:
    <<: *java-service
    container_name: koko-nexus-notification
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR_FILE: artifacts/notification-service.jar }
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://mysql:3306/koko_notification?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      NOTIFICATION_CONSUMER_ENABLED: "true"
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx144m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8085/actuator/health]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  asset:
    <<: *java-service
    container_name: koko-nexus-asset
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR_FILE: artifacts/asset-service.jar }
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://mysql:3306/koko_asset?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      ASSET_MINIO_ENDPOINT: http://minio:9000
      ASSET_MINIO_BUCKET: koko-nexus-media
      ASSET_MINIO_ACCESS_KEY: ${ASSET_MINIO_ACCESS_KEY:?ASSET_MINIO_ACCESS_KEY is required}
      ASSET_MINIO_SECRET_KEY: ${ASSET_MINIO_SECRET_KEY:?ASSET_MINIO_SECRET_KEY is required}
      ASSET_OWNER_QUOTA_BYTES: ${ASSET_OWNER_QUOTA_BYTES:-104857600}
      ASSET_OWNER_QUOTA_IMAGES: ${ASSET_OWNER_QUOTA_IMAGES:-100}
      ASSET_TOTAL_QUOTA_BYTES: ${ASSET_TOTAL_QUOTA_BYTES:-1073741824}
      ASSET_TOTAL_QUOTA_IMAGES: ${ASSET_TOTAL_QUOTA_IMAGES:-10000}
      KOKO_GATEWAY_INTERNAL_KEY: ${KOKO_GATEWAY_INTERNAL_KEY:?KOKO_GATEWAY_INTERNAL_KEY is required}
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8086/actuator/health/readiness]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  chat:
    <<: *java-service
    container_name: koko-nexus-chat
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR_FILE: artifacts/chat-service.jar }
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://mysql:3306/koko_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      KOKO_GATEWAY_INTERNAL_KEY: ${KOKO_GATEWAY_INTERNAL_KEY:?KOKO_GATEWAY_INTERNAL_KEY is required}
      CHAT_ALLOWED_ORIGINS: ${KOKO_CHAT_ALLOWED_ORIGINS:?KOKO_CHAT_ALLOWED_ORIGINS is required}
      # 默认没有审核员，必须由项目负责人明确指定已有账号 ID。
      CHAT_MODERATOR_USER_IDS: ${CHAT_MODERATOR_USER_IDS:-}
      # WS 地址仅为容器内网监听；无公网 ports 映射。跨节点仍须另外配置 WS 入口分流。
      CHAT_WS_BIND_ADDRESS: ${CHAT_WS_BIND_ADDRESS:-0.0.0.0}
      CHAT_SYNC_POLL_INTERVAL_MS: ${CHAT_SYNC_POLL_INTERVAL_MS:-1000}
      KOKO_PUBLIC_API_BASE: /koko-api
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx160m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=32m -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    deploy:
      resources:
        limits:
          memory: 448M
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8087/actuator/health/readiness]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s

  gateway:
    <<: *java-service
    container_name: koko-nexus-gateway
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR_FILE: artifacts/gateway-service.jar }
    environment:
      <<: *common-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # HTTP与Dubbo分组隔离后使用实际Nacos发现；单机也不依赖重建后的旧Docker地址。
      # 必须同步升级全部HTTP提供方及chat的WS元数据；这不代表多节点容量验收。
      COMMUNITY_SERVICE_URI: ${COMMUNITY_SERVICE_URI:-lb://koko-nexus-community}
      LIVE_SERVICE_URI: ${LIVE_SERVICE_URI:-lb://koko-nexus-live}
      VOICE_SERVICE_URI: ${VOICE_SERVICE_URI:-lb://koko-nexus-voice}
      NOTIFICATION_SERVICE_URI: ${NOTIFICATION_SERVICE_URI:-lb://koko-nexus-notification}
      ASSET_SERVICE_URI: ${ASSET_SERVICE_URI:-lb://koko-nexus-asset}
      CHAT_SERVICE_URI: ${CHAT_SERVICE_URI:-lb://koko-nexus-chat}
      CHAT_WS_SERVICE_URI: ${CHAT_WS_SERVICE_URI:-lb:ws://koko-nexus-chat}
      # 仅Java受限媒体路由；正式启用必须同时封闭原始SFU公网信令及/rtc绕过入口。
      MEDIA_ADMISSION_ENABLED: ${MEDIA_ADMISSION_ENABLED:-false}
      MEDIA_ALLOWED_ORIGINS: ${MEDIA_ALLOWED_ORIGINS:-}
      LIVEKIT_SIGNAL_WS_URI: ws://koko-nexus-livekit:7880
      LIVEKIT_SIGNAL_HTTP_URI: http://koko-nexus-livekit:7880
      KOKO_GATEWAY_INTERNAL_KEY: ${KOKO_GATEWAY_INTERNAL_KEY:?KOKO_GATEWAY_INTERNAL_KEY is required}
      # 正式TLS验收后必须true；默认false仅保留既有阶段HTTP兼容，不代表正式上线。
      KOKO_COOKIE_SECURE: ${KOKO_COOKIE_SECURE:-false}
    depends_on:
      identity: { condition: service_healthy }
      community: { condition: service_healthy }
      live: { condition: service_healthy }
      voice: { condition: service_healthy }
      asset: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/actuator/health]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  web:
    container_name: koko-nexus-web
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    networks: [platform]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 20s
      timeout: 5s
      retries: 5

networks:
  platform:
    external: true
    name: infra_default
