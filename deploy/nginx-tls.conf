# 专用TLS边缘：证书材料目录单独挂载，不能挂载整个ACME账号目录。
# 只有可信IP/域名SAN验证与外部HTTPS/WSS验收后才开启媒体候选。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/koko-tls/current/fullchain.pem;
    ssl_certificate_key /etc/koko-tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KOKO_TLS:2m;
    ssl_session_timeout 10m;
    # TLS边缘也约束登录Cookie，避免后端阶段HTTP配置让它被带回明文入口。
    proxy_cookie_flags ~ secure httponly samesite=lax;
    access_log off;
    error_log /dev/null crit;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = / {
        return 302 /koko/;
    }
    location /koko/ {
        proxy_pass http://koko-nexus-web:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /koko-api/media/livekit/ {
        rewrite ^/koko-api/(.*)$ /api/$1 break;
        proxy_pass http://koko-nexus-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
    location /koko-api/ {
        rewrite ^/koko-api/(.*)$ /api/$1 break;
        proxy_pass http://koko-nexus-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
    location ^~ /rtc {
        return 404;
    }
    location / {
        return 404;
    }
}
