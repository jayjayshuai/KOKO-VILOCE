# Add these locations inside the existing public port-80 server block.
location /koko/ {
    proxy_pass http://koko-nexus-web:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# LiveKit SDK把JWT放在查询串；此候选入口禁止access_log记录完整$request。
# 仅部署Java Gateway/voice准入并收紧SFU端口后才配置LIVEKIT_PUBLIC_URL到此基址。
location /koko-api/media/livekit/ {
    access_log off;
    # upstream连接错误也可能带完整$request；本入口只保留crit，不将普通错误写出JWT。
    error_log /dev/null crit;
    rewrite ^/koko-api/(.*)$ /api/$1 break;
    proxy_pass http://koko-nexus-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /koko-api/ {
    rewrite ^/koko-api/(.*)$ /api/$1 break;
    proxy_pass http://koko-nexus-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# LiveKit client signal endpoint. Media packets still use the ICE/TURN ports directly.
location /rtc {
    proxy_pass http://koko-nexus-livekit:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}
