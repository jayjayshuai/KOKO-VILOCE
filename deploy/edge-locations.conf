# Add these locations inside the existing public port-80 server block.
location /koko/ {
    # 正常浏览器先进入安全上下文，不能在旧HTTP页面输入登录密码或请求麦克风。
    return 308 https://$host$request_uri;
}

# LiveKit SDK把JWT放在查询串，正式媒体只走独立HTTPS/WSS边缘。
# 明文请求不重定向携带令牌的URL，不记录完整$request，也不进入Gateway。
location ^~ /koko-api/media/livekit/ {
    access_log off;
    # upstream连接错误也可能带完整$request；本入口只保留crit，不将普通错误写出JWT。
    error_log /dev/null crit;
    return 426;
}

location /koko-api/ {
    # API不重定向潜在令牌/密码请求，客户端必须直接使用HTTPS。
    access_log off;
    error_log /dev/null crit;
    return 426;
}

# 旧路径不得直接进入SFU，否则注销/下麦后的旧JWT可绕过Java准入。
# 前缀拒绝同时覆盖旧v0/v1和验证端点；不记录可能携带JWT的查询串。
location ^~ /rtc {
    access_log off;
    error_log /dev/null crit;
    return 404;
}
