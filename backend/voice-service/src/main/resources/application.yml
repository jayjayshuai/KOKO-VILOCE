server:
  port: 8084
  # 资源保护配置，不是容量验收结果；身份RPC/媒体调用不占无限Servlet线程。
  tomcat.threads.max: 16
  tomcat.threads.min-spare: 2
  tomcat.accept-count: 32
  tomcat.max-connections: 512

spring:
  application:
    name: koko-nexus-voice
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/koko_voice?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DATABASE_USER:koko_nexus}
    password: ${DATABASE_PASSWORD:}
    hikari.maximum-pool-size: 4
    hikari.connection-timeout: 3000
  cloud.nacos.discovery:
    server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    namespace: ${NACOS_NAMESPACE:}
    # HTTP 实例不得与同名 Dubbo 应用实例混入同一发现列表。
    group: ${NACOS_HTTP_GROUP:${NACOS_GROUP:KOKO_NEXUS_PROD}_HTTP}
  flyway:
    enabled: true
    validate-migration-naming: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: koko-nexus-voice
    qos-enable: false
  registry:
    address: nacos://${NACOS_SERVER_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    group: ${NACOS_GROUP:KOKO_NEXUS_PROD}
    parameters:
      namespace: ${NACOS_NAMESPACE:}
  consumer:
    check: false
    timeout: 10000
    retries: 0

livekit:
  api-url: ${LIVEKIT_API_URL:http://localhost:7880}
  public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}

koko.voice.gateway-key: ${KOKO_GATEWAY_INTERNAL_KEY:}
# 只启用候选SQL互动核心，不启用媒体发布；正式P1验收前保持false。
koko.voice.interaction-core-enabled: ${VOICE_INTERACTION_CORE_ENABLED:false}
# 新网关信令准入候选，未完成私有SFU/TLS/全网络验收前不开放。
koko.voice.signal-admission-enabled: ${VOICE_SIGNAL_ADMISSION_ENABLED:false}
# SQL计划/异步退场是分开的候选开关；都不开放CONTROLLED媒体，不启动自动业务写测试。
koko.voice.media-plan-enabled: ${VOICE_MEDIA_PLAN_ENABLED:false}
koko.voice.media-retirement.enabled: ${VOICE_MEDIA_RETIREMENT_ENABLED:false}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: never
