server:
  port: 8087
  tomcat.threads.max: 16
spring:
  application.name: koko-nexus-chat
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/koko_chat?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER:koko}
    password: ${DATABASE_PASSWORD:}
    hikari.maximum-pool-size: 4
  flyway.table: chat_flyway_schema_history
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s
  cloud.nacos.discovery:
    server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:}
    # HTTP 实例不得与同名 Dubbo 应用实例混入同一发现列表。
    group: ${NACOS_HTTP_GROUP:${NACOS_GROUP:KOKO_NEXUS_PROD}_HTTP}
    namespace: ${NACOS_NAMESPACE:}
    # 同一个 HTTP 实例的 Netty 监听端口，供 Gateway lb:ws 路由映射，不用于 HTTP/Dubbo 转发。
    metadata.koko-chat-websocket-port: ${CHAT_WS_PORT:8097}
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration.map-underscore-to-camel-case: true
dubbo:
  application:
    name: koko-nexus-chat
    qos-enable: false
  protocol:
    name: tri
    port: 20887
  registry:
    address: nacos://${NACOS_SERVER_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:}
    group: ${NACOS_GROUP:KOKO_NEXUS_PROD}
    parameters.namespace: ${NACOS_NAMESPACE:}
  consumer:
    check: false
    timeout: 5000
    retries: 0
sa-token:
  token-name: koko-nexus-token
  timeout: 604800
  active-timeout: 1800
  is-read-body: false
  is-read-cookie: true
  is-read-header: true
koko.chat:
  gateway-key: ${KOKO_GATEWAY_INTERNAL_KEY:}
  websocket-port: ${CHAT_WS_PORT:8097}
  websocket-bind-address: ${CHAT_WS_BIND_ADDRESS:0.0.0.0}
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  moderator-user-ids: ${CHAT_MODERATOR_USER_IDS:}
  # 持久用户版本驱动跨节点同步，独立单线程；每批最多 100 个本机认证用户。
  sync-poll-interval-ms: ${CHAT_SYNC_POLL_INTERVAL_MS:1000}
koko.public-api-base: ${KOKO_PUBLIC_API_BASE:/api}
springdoc:
  api-docs.path: /api/chat/docs/v3/api-docs
  swagger-ui:
    enabled: false
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
