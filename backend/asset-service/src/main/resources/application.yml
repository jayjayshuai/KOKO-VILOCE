server:
  port: 8086
  tomcat.max-swallow-size: 6MB
spring:
  application.name: koko-nexus-asset
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/koko_asset?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER:koko}
    password: ${DATABASE_PASSWORD:koko_local_only}
  flyway.table: asset_flyway_schema_history
  servlet.multipart:
    max-file-size: 5MB
    max-request-size: 6MB
    file-size-threshold: 0
  cloud.nacos.discovery:
    server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    namespace: ${NACOS_NAMESPACE:}
    # HTTP 实例不得与同名 Dubbo 应用实例混入同一发现列表。
    group: ${NACOS_HTTP_GROUP:${NACOS_GROUP:KOKO_NEXUS_PROD}_HTTP}
mybatis-plus.configuration.map-underscore-to-camel-case: true
dubbo:
  application:
    name: koko-nexus-asset
    qos-enable: false
  protocol:
    name: tri
    port: 20886
  registry:
    address: nacos://${NACOS_SERVER_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    group: ${NACOS_GROUP:KOKO_NEXUS_PROD}
    parameters:
      namespace: ${NACOS_NAMESPACE:}
  consumer:
    check: false
    timeout: 5000
    retries: 0
koko.asset:
  endpoint: ${ASSET_MINIO_ENDPOINT:http://localhost:9000}
  bucket: ${ASSET_MINIO_BUCKET:koko-nexus-media}
  access-key: ${ASSET_MINIO_ACCESS_KEY:}
  secret-key: ${ASSET_MINIO_SECRET_KEY:}
  gateway-key: ${KOKO_GATEWAY_INTERNAL_KEY:}
  quota:
    owner-bytes: ${ASSET_OWNER_QUOTA_BYTES:104857600}
    owner-images: ${ASSET_OWNER_QUOTA_IMAGES:100}
    total-bytes: ${ASSET_TOTAL_QUOTA_BYTES:1073741824}
    total-images: ${ASSET_TOTAL_QUOTA_IMAGES:10000}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db,assetReferences
