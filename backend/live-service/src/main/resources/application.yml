server.port: 8083
koko.operations.enabled: ${OPERATIONS_ENABLED:false}

spring:
  application.name: koko-nexus-live
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/koko_live?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER:koko}
    password: ${DATABASE_PASSWORD:}
  flyway.table: live_flyway_schema_history
  cloud.nacos.discovery:
    server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:}
    namespace: ${NACOS_NAMESPACE:}
    # HTTP 实例不得与同名 Dubbo 应用实例混入同一发现列表。
    group: ${NACOS_HTTP_GROUP:${NACOS_GROUP:KOKO_NEXUS_PROD}_HTTP}
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration.map-underscore-to-camel-case: true
dubbo:
  application.name: koko-nexus-live
  application.qos-enable: false
  registry:
    address: nacos://${NACOS_SERVER_ADDR:localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:}
    group: ${NACOS_GROUP:KOKO_NEXUS_PROD}
    parameters.namespace: ${NACOS_NAMESPACE:}
  consumer:
    check: false
    timeout: 3000
    retries: 0
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
koko.outbox:
  enabled: ${OUTBOX_ENABLED:false}
  nameserver: ${ROCKETMQ_NAMESERVER:localhost:9876}
  topic: ${ROCKETMQ_NOTIFICATION_TOPIC:koko_nexus_notifications}
